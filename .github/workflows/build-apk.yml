name: Build Real AI Bot
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Install Gradle
        run: |
          wget https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip gradle-8.5-bin.zip
          echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH
      - name: Create Files
        run: |
          mkdir -p app/src/main/java/com/aisupplier/bot
          mkdir -p app/src/main/res/layout
          echo "include ':app'" > settings.gradle
          echo "buildscript{repositories{google();mavenCentral()} dependencies{classpath 'com.android.tools.build:gradle:8.2.2'}} allprojects{repositories{google();mavenCentral()}}" > build.gradle
          
          cat > app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          android{compileSdk 34; defaultConfig{applicationId "com.aisupplier.bot"; minSdk 24; targetSdk 34; versionCode 2; versionName "2.0"} buildTypes{release{minifyEnabled false}}}
          dependencies{implementation 'com.squareup.okhttp3:okhttp:4.12.0'}
          EOF
          
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.INTERNET"/>
          <application android:label="AI Bot"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity><service android:name=".AutoReplyService" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" android:exported="true"><intent-filter><action android:name="android.service.notification.NotificationListenerService"/></intent-filter></service></application></manifest>
          EOF
          
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:padding="16dp"><EditText android:id="@+id/apiKey" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="Gemini API Key"/><EditText android:id="@+id/biz" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="ব্যবসার তথ্য লিখুন" android:minLines="3"/><Button android:id="@+id/save" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Save"/></LinearLayout>
          EOF
          
          # MainActivity এবং Service এর কোড আগের উত্তরে যেটা দিয়েছি সেটাই থাকবে
      - name: Build APK
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: real-ai-apk
          path: app/build/outputs/apk/debug/*.apk
