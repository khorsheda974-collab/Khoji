
name: Build KHOJI AI Assistant APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract uploaded project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found in repository root."
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          if [ ! -f \
            "extracted/khoji-ai-assistant/android/app/build.gradle.kts" ]; then
            echo "ERROR: Android project files not found."
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: extracted/khoji-ai-assistant/android
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: khoji-ai-assistant-debug-apk
          path: extracted/khoji-ai-assistant/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
