name: build-final-fix
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup SDK manually
        run: |
          echo "y" | sudo apt-get install -y wget unzip
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p latest
          mv cmdline-tools/* latest/ 2>/dev/null || true
          mv lib latest/ 2>/dev/null || true
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Create Project
        run: |
          mkdir -p app/src/main/java/com/aisupplier/bot
          mkdir -p app/src/main/res/layout
          echo "include ':app'" > settings.gradle
          printf "buildscript{repositories{google();mavenCentral()} dependencies{classpath 'com.android.tools.build:gradle:8.2.2'}} allprojects{repositories{google();mavenCentral()}}" > build.gradle
          
          cat > app/build.gradle << 'ENDOFFILE'
          apply plugin: 'com.android.application'
          android {
              compileSdk 34
              defaultConfig {
                  applicationId "com.aisupplier.bot"
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName "3.0-fix"
              }
              buildTypes { release { minifyEnabled false } }
          }
          dependencies {
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          ENDOFFILE

          cat > app/src/main/AndroidManifest.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="AI Supplier Bot">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
                  <service android:name=".AutoReplyService" android:label="AI Reply" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" android:exported="true">
                      <intent-filter><action android:name="android.service.notification.NotificationListenerService"/></intent-filter>
                  </service>
              </application>
          </manifest>
          ENDOFFILE

          cat > app/src/main/res/layout/activity_main.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:padding="16dp">
              <EditText android:id="@+id/apiKey" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="Gemini API Key"/>
              <EditText android:id="@+id/biz" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="ব্যবসার তথ্য" android:minLines="3"/>
              <Button android:id="@+id/save" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Save & Enable"/>
          </LinearLayout>
          ENDOFFILE

          cat > app/src/main/java/com/aisupplier/bot/MainActivity.kt << 'ENDOFFILE'
          package com.aisupplier.bot
          import android.content.Intent
          import android.os.Bundle
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  val api = findViewById<EditText>(R.id.apiKey)
                  val biz = findViewById<EditText>(R.id.biz)
                  val btn = findViewById<Button>(R.id.save)
                  val pref = getSharedPreferences("bot", MODE_PRIVATE)
                  api.setText(pref.getString("api", ""))
                  biz.setText(pref.getString("biz", ""))
                  btn.setOnClickListener {
                      pref.edit().putString("api", api.text.toString()).putString("biz", biz.text.toString()).apply()
                      startActivity(Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS"))
                      Toast.makeText(this, "Save হয়েছে, Notification ON করো", Toast.LENGTH_LONG).show()
                  }
              }
          }
          ENDOFFILE

          cat > app/src/main/java/com/aisupplier/bot/AutoReplyService.kt << 'ENDOFFILE'
          package com.aisupplier.bot
          import android.app.Notification
          import android.content.Context
          import android.os.Bundle
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import okhttp3.*
          import okhttp3.MediaType.Companion.toMediaType
          import org.json.JSONObject
          import java.io.IOException
          class AutoReplyService : NotificationListenerService() {
              private val client = OkHttpClient()
              override fun onNotificationPosted(sbn: StatusBarNotification) {
                  if (sbn.packageName != "com.whatsapp" && sbn.packageName != "com.whatsapp.w4b") return
                  val pref = getSharedPreferences("bot", Context.MODE_PRIVATE)
                  val apiKey = pref.getString("api", "") ?: ""
                  if (apiKey.isEmpty()) return
                  val extras = sbn.notification.extras
                  val title = extras.getCharSequence("android.title")?.toString() ?: ""
                  val text = extras.getCharSequence("android.text")?.toString() ?: ""
                  if (text.isEmpty() || title.isEmpty()) return
                  if (sbn.notification.flags and Notification.FLAG_GROUP_SUMMARY != 0) return
                  val biz = pref.getString("biz", "আমরা অনলাইন শপ")
                  val prompt = "You are AI assistant for: $biz. Customer says: $text. Reply in Bangla short friendly. Add [AI Bot] at end."
                  callGemini(apiKey, prompt) { aiReply ->
                      try {
                          val act = sbn.notification.actions?.lastOrNull() ?: return@callGemini
                          val intent = android.content.Intent()
                          val bundle = Bundle()
                          bundle.putCharSequence(act.remoteInputs[0].resultKey, aiReply)
                          android.app.RemoteInput.addResultsToIntent(act.remoteInputs, intent, bundle)
                          act.actionIntent.send(this, 0, intent)
                      } catch (e: Exception) {}
                  }
              }
              private fun callGemini(apiKey: String, prompt: String, cb: (String)->Unit) {
                  val json = JSONObject().put("contents", org.json.JSONArray().put(JSONObject().put("parts", org.json.JSONArray().put(JSONObject().put("text", prompt)))))
                  val req = Request.Builder().url("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$apiKey").post(RequestBody.create("application/json".toMediaType(), json.toString())).build()
                  client.newCall(req).enqueue(object: Callback {
                      override fun onFailure(call: Call, e: IOException) {}
                      override fun onResponse(call: Call, response: Response) {
                          try {
                              val res = JSONObject(response.body?.string() ?: "")
                              val reply = res.getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text")
                              cb(reply)
                          } catch (e: Exception) {}
                      }
                  })
              }
          }
          ENDOFFILE

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Bot-Fixed-APK
          path: app/build/outputs/apk/debug/*.apk
